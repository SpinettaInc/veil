# Paranoid detection profile.
# Source of truth for this profile; loaded by veil.weighting.config.
# Regenerate from the Python defaults with: python -m veil.weighting.config
# Entity types must be EntityType names; custom_patterns entries take
# name, regex, entity_type, confidence, context (list), requires_context.
name: paranoid
threshold: 0.3
rarity_factor: 0.15
context_window: 100
entity_weights:
  PERSON: 1.0
  ORG: 0.95
  GPE: 0.85
  LOC: 0.8
  FAC: 0.8
  SSN: 1.0
  CREDIT_CARD: 1.0
  EMAIL: 1.0
  PHONE: 0.95
  IP_ADDRESS: 0.9
  PASSPORT: 1.0
  DRIVER_LICENSE: 1.0
  BANK_ACCOUNT: 1.0
  IBAN: 1.0
  MEDICAL_RECORD: 1.0
  HEALTH_PLAN: 1.0
  DEVICE_ID: 1.0
  DATE: 0.7
  TIME: 0.4
  MONEY: 0.4
  PERCENT: 0.25
  CARDINAL: 0.25
  ORDINAL: 0.2
  QUANTITY: 0.3
  PRODUCT: 0.45
  EVENT: 0.45
  WORK_OF_ART: 0.45
  NORP: 0.55
  LANGUAGE: 0.4
  LAW: 0.4
  URL: 0.8
  LICENSE_PLATE: 0.95
  CUSTOM: 0.6
  UNKNOWN: 0.4
pos_multipliers:
  PROPN: 1.2
  NOUN: 1.0
  NUM: 0.8
  ADJ: 0.6
  VERB: 0.3
  ADV: 0.3
  ADP: 0.1
  AUX: 0.1
  CCONJ: 0.1
  DET: 0.1
  PART: 0.1
  PRON: 0.2
  SCONJ: 0.1
  PUNCT: 0.0
  SYM: 0.2
  X: 0.3
context_patterns:
- pattern: \b(?:CEO|CTO|CFO|COO|President|Chairman)\s+(?:of\s+)?
  boost: 0.15
  description: Executive role context
- pattern: \b(?:founder|director|manager|executive)\s+(?:of\s+)?
  boost: 0.1
  description: Leadership role context
- pattern: \bpatient\s+(?:named?|called|is|was)?\s*
  boost: 0.2
  description: Patient reference
- pattern: \bdiagnos(?:ed|is)\s+(?:with\s+)?
  boost: 0.2
  description: Diagnosis context
- pattern: \bmedical\s+record
  boost: 0.15
  description: Medical record context
- pattern: \bhealth\s+(?:insurance|plan|condition)
  boost: 0.15
  description: Health-related context
- pattern: \baccount\s*(?:number|#|no\.?)?
  boost: 0.2
  description: Account number context
- pattern: \bsocial\s*security
  boost: 0.25
  description: Social security context
- pattern: \b(?:credit|debit)\s*card
  boost: 0.15
  description: Credit card context
- pattern: \bbank\s+(?:account|routing)
  boost: 0.2
  description: Bank account context
- pattern: \bborn\s+(?:on|in)\s*
  boost: 0.15
  description: Birth date context
- pattern: \blives?\s+(?:at|in)\s*
  boost: 0.15
  description: Address context
- pattern: \bworks?\s+(?:at|for)\s*
  boost: 0.1
  description: Employment context
- pattern: \bcontact\s+(?:at|via|:)?\s*
  boost: 0.1
  description: Contact info context
- pattern: \bpassport\s*(?:number|#|no\.?)?
  boost: 0.2
  description: Passport context
- pattern: \b(?:driver'?s?\s*)?licen[cs]e\s*(?:number|#|no\.?)?
  boost: 0.2
  description: License context
- pattern: \b(?:my|his|her|their)\s+(?:name|email|phone|address|ssn)
  boost: 0.15
  description: Possessive personal info
custom_patterns: []
