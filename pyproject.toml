[project]
name = "veil"
version = "0.1.0"
description = "Privacy-preserving proxy for LLMs - anonymize sensitive data before sending to AI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Veil Contributors"}
]
keywords = ["privacy", "llm", "anonymization", "pii", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "spacy>=3.7.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
llm = [
    "litellm>=1.0.0",
]
embeddings = [
    "gensim>=4.3.0",
]
faker = [
    "faker>=20.0.0",
]
rarity = [
    "wordfreq>=3.0.0",
]
openai = [
    "openai>=1.0.0",
]
anthropic = [
    "anthropic>=0.18.0",
]
desktop = [
    "gradio>=4.0.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "requests>=2.31.0",
]
full = [
    "litellm>=1.0.0",
    "gensim>=4.3.0",
    "faker>=20.0.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "gradio>=4.0.0",
    "wordfreq>=3.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
veil = "veil.cli:app"
veil-app = "veil.app.desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veil"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Labeled corpus lines are long by nature; P/R/F1 are conventional metric names.
"benchmarks/*" = ["E501", "N806"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=veil --cov-report=term-missing"
markers = [
    "desktop: Gradio desktop app tests (slow, optional dependency); deselect with -m 'not desktop'",
]
